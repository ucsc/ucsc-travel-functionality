# Continuous integration. Runs on every pull request and on pushes to main.
#
# The checks job runs PHPCS and PHPUnit. The PHPUnit suite stubs WordPress
# (see tests/bootstrap.php), so this job needs no WordPress install and no
# database. PHP 8.1 is the declared floor in plugin.php and composer.json.
# PHP 8.4 is the forward-compatibility check.
#
# The package job builds the distributable ZIP and checks its contents.
# `plugin-zip` is the only part of @wordpress/scripts that the plugin uses.
# Without this job, a dependency update that breaks it shows only when a
# release tag is pushed.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to the same ref makes the run in progress redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not only the first.
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPCS
        run: composer lint

      - name: Run PHPUnit
        run: composer test

  package:
    name: Build ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          # The shared ucsc/actions release workflow uses Node 24 by default,
          # so this job builds the ZIP the same way a release does.
          node-version: '24'
          cache: 'npm'

      # `npm ci` also fails if package-lock.json does not match package.json.
      - name: Install Node dependencies
        run: npm ci

      - name: Build the distributable ZIP
        run: npm run zip

      - name: Check ZIP contents
        run: |
          set -euo pipefail
          zip='ucsc-travel-functionality.zip'
          root='ucsc-travel-functionality'

          if [ ! -f "$zip" ]; then
            echo "::error::$zip was not produced"
            exit 1
          fi

          entries="$(unzip -Z1 "$zip" | sort)"
          echo "$entries"

          fail=0

          # The `files` array in package.json, plus package.json itself,
          # which npm always includes.
          required='plugin.php README.md LICENSE package.json'

          # The first `npm run release` creates CHANGELOG.md. Until then,
          # plugin-zip skips it, so require it only when it exists.
          if [ -f CHANGELOG.md ]; then
            required="$required CHANGELOG.md"
          fi

          for path in $required; do
            if ! printf '%s\n' "$entries" | grep -qxF "$root/$path"; then
              echo "::error::ZIP is missing $path"
              fail=1
            fi
          done

          if ! printf '%s\n' "$entries" | grep -q "^$root/lib/"; then
            echo "::error::ZIP is missing lib/"
            fail=1
          fi

          # Development files. None of these may ship to a WordPress site.
          forbidden="^$root/(tests/|node_modules/|vendor/|\.github/|phpunit\.xml\.dist$|\.phpcs\.xml\.dist$|composer\.(json|lock)$|package-lock\.json$|wp-plugin-version-updater\.js$|CLAUDE\.md$|ROADMAP\.md$|blueprint\.json$)"
          if printf '%s\n' "$entries" | grep -Eq "$forbidden"; then
            echo "::error::ZIP contains files that must not ship:"
            printf '%s\n' "$entries" | grep -E "$forbidden"
            fail=1
          fi

          exit "$fail"
